<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>演示店铺 · 商家后台</title><link rel="stylesheet" href="/static/mock.css?v=ops-3"></head><body>
<header class="top"><div class="mark">松木<span>商家工作台</span></div><div class="store-name">松木生活旗舰店 <span class="chip">演示店铺</span></div><div class="top-right">运营账号　 <a href="/">返回 ShopMate Agent ↗</a></div></header>
<div class="shell"><aside class="nav"><div class="nav-caption">店铺管理</div><button class="nav-item active" data-view="orders">订单管理</button><button class="nav-item" data-view="products">商品库存</button><button class="nav-item" data-view="aftersales">售后管理</button><div class="nav-caption">数据概览</div><div class="side-note">订单、商品与售后均为本地模拟数据。操作仅影响此演示店铺。</div><div class="side-bottom">店铺编号：DEMO-202610<br>平台适配：尚未连接</div></aside>
<main><div class="page-head"><div><div class="crumb">店铺管理 / <span id="crumb">订单管理</span></div><h1 id="heading">订单管理</h1><p>查看并处理店铺日常交易</p></div><div class="today">2026 年 10 月 22 日　 星期四</div></div>
<div class="metrics" id="metrics"></div><section class="workspace">
<div id="orders-view" class="view"><div class="toolbar"><div><label for="order-search">搜索订单</label><input id="order-search" placeholder="订单号、商品或收件人"></div><div><label for="order-status">订单状态</label><select id="order-status"><option value="">全部状态</option><option>待发货</option><option>已发货</option><option>已签收</option><option>售后处理中</option></select></div><button id="order-search-submit" class="main-btn">查询订单</button><button id="order-export" class="light-btn">导出当前订单</button></div><div class="result-label" id="result-summary">订单列表</div><div class="table-wrap"><table><thead><tr><th>订单信息</th><th>商品与数量</th><th>金额</th><th>收件信息</th><th>状态 / 运单</th><th>操作</th></tr></thead><tbody id="order-rows"></tbody></table></div></div>
<div id="products-view" class="view" hidden><div class="toolbar"><div><label for="product-search">搜索商品</label><input id="product-search" placeholder="商品名称或 SKU"></div><button id="product-search-submit" class="main-btn">查询商品</button></div><div class="result-label" id="product-summary">商品库存</div><div class="table-wrap"><table><thead><tr><th>商品信息</th><th>分类</th><th>当前售价</th><th>库存数量</th><th>状态</th></tr></thead><tbody id="product-rows"></tbody></table></div></div>
<div id="aftersales-view" class="view" hidden><div class="toolbar"><div><label for="after-status">售后状态</label><select id="after-status"><option value="">全部状态</option><option>待审核</option><option>待补充材料</option><option>已完成</option></select></div><button id="after-search-submit" class="main-btn">查询售后</button></div><div class="result-label" id="after-summary">售后记录</div><div class="table-wrap"><table><thead><tr><th>申请编号</th><th>关联订单</th><th>类型与原因</th><th>状态</th><th>提交时间</th></tr></thead><tbody id="after-rows"></tbody></table></div></div>
</section><footer>演示操作会记录在本地数据库　·　此页面不会连接真实电商平台</footer></main></div><script src="/static/mock-admin.js?v=ops-3"></script></body></html>
